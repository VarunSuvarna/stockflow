services:
  - type: web
    name: stockflow-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false   # you'll fill this in after the client is deployed

  - type: web
    name: stockflow-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # you'll fill this in after the server is deployed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: stockflow-db
    plan: free
    databaseName: stockflow
